name: Publish reviewed MultX v0.9.2 API image

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact Autha-accepted v0.9.2 source commit
        required: true
        default: 5994f263b9d1fd40c531410d6b23884eade9f5b9
      confirmation:
        description: Type PUBLISH_REVIEWED_V092_API to authorize image publication only
        required: true

permissions:
  contents: read

concurrency:
  group: multx-v092-api-image-publish
  cancel-in-progress: false

env:
  ACCEPTED_COMMIT: 5994f263b9d1fd40c531410d6b23884eade9f5b9
  ACCEPTED_SOURCE_SHA256: f40e76603d5dff8d8a283a8d426786c375e3e96bd20aea73de516547c50dfecc
  IMAGE: ghcr.io/kajlabs/lithosphere/multx-api

jobs:
  validate:
    name: Validate exact accepted source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enforce immutable source and explicit publication confirmation
        env:
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$REQUESTED_COMMIT" = "$ACCEPTED_COMMIT"
          test "$CONFIRMATION" = 'PUBLISH_REVIEWED_V092_API'

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACCEPTED_COMMIT }}
          fetch-depth: 1

      - name: Verify checkout identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ACCEPTED_COMMIT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MultX/api/package-lock.json

      - name: Test accepted API source and dependencies
        working-directory: MultX/api
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=moderate
          npm test

      - name: Prove API safety controls are load-bearing
        run: node MultX/scripts/check-closure-mutations.cjs api

  publish:
    name: Scan, publish, sign, and attest
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: multx-image-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACCEPTED_COMMIT }}
          fetch-depth: 1

      - name: Verify checkout identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ACCEPTED_COMMIT"

      - uses: docker/setup-buildx-action@v3

      - name: Build immutable review candidate locally
        uses: docker/build-push-action@v6
        with:
          context: MultX/api
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:v0.9.2-${{ env.ACCEPTED_COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/KaJLabs/Lithosphere
            org.opencontainers.image.revision=${{ env.ACCEPTED_COMMIT }}
            org.opencontainers.image.version=multx-v0.9.2
            ai.multx.source-archive-sha256=${{ env.ACCEPTED_SOURCE_SHA256 }}
          cache-from: type=gha,scope=multx-v092-api
          cache-to: type=gha,mode=max,scope=multx-v092-api

      - name: Reject HIGH or CRITICAL image findings before registry login
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:v0.9.2-${{ env.ACCEPTED_COMMIT }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Log in to GHCR after all publication gates pass
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable tag and capture registry digest
        id: publish
        env:
          IMAGE_TAG: ${{ env.IMAGE }}:v0.9.2-${{ env.ACCEPTED_COMMIT }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG"
          digest="$(docker buildx imagetools inspect "$IMAGE_TAG" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign immutable image
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest GitHub build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: multx-v092-api.spdx.json

      - name: Upload retained SBOM
        uses: actions/upload-artifact@v4
        with:
          name: multx-v092-api-sbom-${{ github.run_id }}
          path: multx-v092-api.spdx.json
          retention-days: 90
          if-no-files-found: error

      - name: Verify signature and provenance
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp '^https://github.com/KaJLabs/Lithosphere/.github/workflows/publish-multx-v092-api.yaml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify "oci://$IMAGE@$DIGEST" --owner KaJLabs

      - name: Record immutable output
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo '## Reviewed MultX v0.9.2 API image'
            echo
            echo "- Source commit: \`$ACCEPTED_COMMIT\`"
            echo "- Image: \`$IMAGE@$DIGEST\`"
            echo "- Source acceptance SHA-256: \`$ACCEPTED_SOURCE_SHA256\`"
            echo '- Deployment performed: `false`'
            echo '- Activation authorized: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
